[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akomagni"
version = "0.1.0"
description = "Poste de travail IA local — multi-métiers, BMAD, offline"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Assou" }]
keywords = ["local-ai", "llm", "bmad", "offline", "huggingface"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "psutil>=5.9",
  "platformdirs>=4.0",
  "sqlite-vec>=0.1.6",
  "questionary>=2.0",
]

[project.optional-dependencies]
inference = [
  "huggingface-hub>=0.23",
]
train = [
  "torch>=2.2",
  "transformers>=4.44",
  "peft>=0.12",
  "datasets>=2.20",
  "accelerate>=0.33",
  "trl>=0.11",
  "bitsandbytes>=0.43; platform_system != 'Windows'",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "bandit>=1.7",
  "pip-audit>=2.7",
]
agent = [
  "mcp>=1.6",
]

[project.scripts]
akomagni = "akomagni.cli.main:app"

[tool.hatch.build.targets.wheel]
only-packages = true

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
  "regression: regression tests that must always pass",
  "integration: tests requiring BMAD workspace or external tools",
]

[tool.coverage.run]
branch = true
source = ["akomagni"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B603", "B404"]
