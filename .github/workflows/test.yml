name: Test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-regression:
    name: Unit & regression tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run regression suite
        run: pytest -m regression -v --tb=short

  coverage:
    name: Coverage (≥90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest with coverage
        run: |
          pytest tests/ \
            --cov=akomagni \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  install-smoke:
    name: Install script smoke (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run install.sh from local source
        run: |
          export AKOMAGNI_INSTALL_DIR="${RUNNER_TEMP}/akomagni-install"
          export AKOMAGNI_SOURCE_DIR="${GITHUB_WORKSPACE}"
          export AKOMAGNI_BIN_DIR="${RUNNER_TEMP}/akomagni-bin"
          bash install/install.sh
          "${RUNNER_TEMP}/akomagni-bin/akomagni" --version
