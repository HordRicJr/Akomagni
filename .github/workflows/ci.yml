name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest

  i18n-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docs/en and docs/fr parity
        shell: bash
        run: |
          comm -3 <(ls docs/en/*.md | xargs -n1 basename | sort) \
                  <(ls docs/fr/*.md | xargs -n1 basename | sort) \
            && echo "i18n doc pages are in sync" \
            || (echo "ERROR: docs/en and docs/fr file lists differ" && exit 1)
