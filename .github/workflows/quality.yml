name: Quality

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

  i18n:
    name: Documentation i18n parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check docs/en and docs/fr parity
        run: |
          comm -3 <(ls docs/en/*.md | xargs -n1 basename | sort) \
                  <(ls docs/fr/*.md | xargs -n1 basename | sort) \
            && echo "i18n doc pages are in sync" \
            || (echo "ERROR: docs/en and docs/fr file lists differ" && exit 1)
