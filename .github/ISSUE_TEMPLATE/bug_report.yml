name: Bug report
description: Report a bug in Akomagni
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in the details below.
        / Merci ! Remplis les détails ci-dessous.

  - type: textarea
    id: description
    attributes:
      label: What happened? / Que s'est-il passé ?
      description: Clear description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / Étapes
      placeholder: |
        1. akomagni doctor
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Akomagni version
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11, Ubuntu 24.04, macOS 14
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      render: shell
