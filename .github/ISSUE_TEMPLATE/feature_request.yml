name: Feature request
description: Suggest a feature for Akomagni
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the feature and why it helps Akomagni users.
        / Décris la fonctionnalité et pourquoi elle aide les utilisateurs.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Problème
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution / Solution proposée
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Akomagni Flow
        - Akomagni Memory
        - Inference
        - CLI
        - IDE
        - Documentation
        - Other
